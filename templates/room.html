{% extends "layout.html" %} {% block title %}{{ room.name }}{% endblock %} {% block content %}
    <h2>{{ room.name }}</h2>

    {% for message in messages %}
    <div class="message">
        <span class="username">{{ message.username }}</span>
        <span class="date">{{ message.time }}</span>
        <p>{{ message.content }}</p>
    </div>
    {% endfor %}

    <form action="/new_message" method="post">
        <!-- csrf -->
        <input
            type="text"
            id="content"
            name="content"
        />
        <input
        type="hidden"
        name="room_id"
        value="{{ room.id }}"
      />
        <input type="submit" value="Send" />
    </form>

    <a href="/user/{{ user.id }}">Go back</a>

{% endblock %}
