{% extends "layout.html" %} {% block title %}Log in{%
endblock %} {% block content %}
  <h2>
   Log in
  </h2>
    
  <form action="/login" method="post">
    <label for="username">Username</label>
    <input
        type="text"
        id="username"
        name="username"
    />
    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        name="password"
    />
    <input
        type="submit"
        value="Log in"
    />
  </form>

  <a href="/register">Create account</a>
 
{% endblock %}
