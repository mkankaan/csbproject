{% extends "layout.html" %} {% block title %}Log in{%
endblock %} {% block content %}
  <h2>
   Log in
  </h2>
    
  <form action="/login" method="post">
    <label for="username">Username</label>
    <input
        type="text"
        id="username"
        name="username"
        required
    />
    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        name="password"
        required
    />
    <input
        type="submit"
        value="Log in"
    />
  </form>
  <div class="error">
  {% for message in get_flashed_messages() %}
    {{ message }}
  {% endfor %}
  </div>

  <br/><a href="/register">Create account</a>
 
{% endblock %}
