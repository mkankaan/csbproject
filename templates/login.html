{% extends "layout.html" %} {% block title %}Log in{%
endblock %} {% block content %}
  <h2>
   Log in
  </h2>
    
  <form action="/login" method="post">
    <div>
    <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
        />
    </div>
    <div>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
        />
    </div>
    <div>
        <input
            type="submit"
            value="Log in"
        />
    </div>
  </form>
 
{% endblock %}
